[project]
name = "sepreformer"
version = "0.1.0"
requires-python = "~=3.12"
dependencies = [
    "librosa>=0.11.0",
    "loguru>=0.7.3",
    "mir-eval>=0.8.2",
    "ptflops>=0.7.4",
    "pyyaml>=6.0.2",
    "tensorboard>=2.19.0",
    "thop>=0.1.1.post2209072238",
    "torch",
    "torchaudio",
    "torchinfo>=1.8.0",
    "tqdm>=4.66.5",
]

[tool.uv.sources]
torch = { index = "pytorch-rocm6.3" }
torchaudio = { index = "pytorch-rocm6.3" }

[[tool.uv.index]]
name = "pytorch-rocm6.3"
url = "https://download.pytorch.org/whl/nightly/rocm6.3"
